# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:mailhog}
spring.mail.password=${MAIL_PASSWORD:mailhog}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

broker.queue.evento.atualizar=${BROKER_QUEUE_EVENTO_ATUALIZAR:evento.atualizar}
broker.queue.inscricao.criada=${RABBITMQ_QUEUE_INSCRICAO_CRIADA:inscricao.criada}

# Feign
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}
api.local.list-url=${API_LOCAL_LIST_URL:http://localhost:8083/api/locais}
api.evento.list-url=${API_EVENTO_LIST_URL:http://localhost:8084/api/eventos}
api.inscricao.list-url=${API_INSCRICAO_LIST_URL:http://localhost:8085/api/inscricoes}