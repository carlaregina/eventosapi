spring.application.name=comunicacao-api

server.port=${SERVER_PORT:8086}
# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:eventos}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate

# Swagger
springdoc.api-docs.path=/documentacao
springdoc.swagger-ui.path=/documentacao.html

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:mailhog}
spring.mail.password=${MAIL_PASSWORD:mailhog}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

broker.queue.evento.atualizar=${BROKER_QUEUE_EVENTO_ATUALIZAR:evento.atualizar}
broker.queue.inscricao.criada=${RABBITMQ_QUEUE_INSCRICAO_CRIADA:inscricao.criada}

# Feign
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}
api.evento.list-url=${API_EVENTO_LIST_URL:http://localhost:8084/api/eventos}
api.inscricao.list-url=${API_INSCRICAO_LIST_URL:http://localhost:8085/api/inscricoes}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Health
management.endpoints.web.exposure.include=health,info,prometheus

# Logging
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}