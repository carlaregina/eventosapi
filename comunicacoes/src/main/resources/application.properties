spring.application.name=comunicacao-api

server.port=${SERVER_PORT:8085}
# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:eventos}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate

# Swagger
springdoc.api-docs.path=/documentacao
springdoc.swagger-ui.path=/documentacao.html

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:mailhog}
spring.mail.password=${MAIL_PASSWORD:mailhog}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#MOCK
spring.profiles.active=mock

#RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

broker.queue.evento.atualizar=${BROKER_QUEUE_EVENTO_ATUALIZAR:evento.atualizar}

# Feign
servicos.usuarios.url=http://localhost:8083/api/usuarios
servicos.locais.url=http://localhost:8081/api/locais
servicos.inscricao.url=http://localhost:8086/api/inscricoes
servicos.eventos.url=http://localhost:8084/api/eventos

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Health
management.endpoints.web.exposure.include=health