# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Security
security.token.secret=test-secret
security.token.expiration-time-in-minutes=60

# API
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}

# Serviços
servicos.usuarios.url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}
servicos.locais.url=${API_LOCAL_LIST_URL:http://localhost:8083/api/locais}
servicos.inscricao.url=${API_INSCRICAO_LIST_URL:http://localhost:8085/api/inscricoes}

#RABBITMQ
spring.rabbitmq.host=${RABBIT_MQ_HOST:localhost}
spring.rabbitmq.port=${RABBIT_MQ_PORT:5672}
spring.rabbitmq.username=${RABBIT_MQ_USERNAME:user}
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD:pass}
spring.rabbitmq.ssl.enabled=${RABBIT_MQ_SSL_ENABLED:false}

broker.queue.evento.atualizar=evento.att.comunicacoes
