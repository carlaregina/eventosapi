services:
  auth-api:
    build:
      context: ./auth/.
      dockerfile: Dockerfile
    container_name: auth-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - service-discovery

  usuario-api:
    build:
      context: ./usuario/.
      dockerfile: Dockerfile
    container_name: usuario-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - service-discovery

  local-api:
    build:
      context: ./local/.
      dockerfile: Dockerfile
    container_name: local-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      API_USUARIO_LIST_URL: http://usuario-api:8080/api/usuarios
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - service-discovery
      - usuario-api

  evento-api:
    build:
      context: ./evento/.
      dockerfile: Dockerfile
    container_name: evento-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      API_USUARIO_LIST_URL: http://usuario-api:8080/api/usuarios
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - service-discovery
      - usuario-api

  inscricao-api:
    build:
      context: ./inscricao/.
      dockerfile: Dockerfile
    container_name: inscricao-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      API_USUARIO_LIST_URL: http://usuario-api:8080/api/usuarios
      API_EVENTO_LIST_URL: http://evento-api:8080/api/eventos
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - service-discovery
      - evento-api
      - usuario-api

  comunicacao-api:
    build:
      context: ./comunicacoes/.
      dockerfile: Dockerfile
    container_name: comunicacao-api
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      EUREKA_SERVER_URL: http://service-discovery:8761/eureka
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: mailhog
      MAIL_PASSWORD: mailhog
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
      RABBITMQ_SSL_ENABLED: false
      BROKER_QUEUE_EVENTO_ATUALIZAR: evento.atualizar
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - mailhog
      - rabbitmq
      - service-discovery

  service-discovery:
    build:
      context: ./service-discovery/.
      dockerfile: Dockerfile
    container_name: service-discovery
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  postgres:
    image: postgres:17-alpine3.21
    container_name: eventos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "eventos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

