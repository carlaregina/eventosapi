server:
  port: ${SERVER_PORT:8086}

spring:
  application.name: inscricao
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:eventos}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

# Security
security:
  token:
    secret: ${JWT_SECRET:eventos}
    expiration-time-in-minutes: ${JWT_EXPIRATION_IN_MINUTES:60}

# APIs
api:
  usuario:
    list-url: ${API_USUARIO_LIST_URL:http://localhost:8080/api/usuarios}
