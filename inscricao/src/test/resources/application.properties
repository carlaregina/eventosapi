# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Security
security.token.secret=test-secret
security.token.expiration-time-in-minutes=60

# APIs
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}
api.evento.list-url=${API_EVENTO_LIST_URL:http://localhost:8084/api/eventos}

#RABBITMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pass}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

broker.queue.enviar-email=${BROKER_QUEUE_ENVIAR_EMAIL:enviar-email}