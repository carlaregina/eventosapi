# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Security
security.token.secret=test-secret
security.token.expiration-time-in-minutes=60

# APIs
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}
api.evento.list-url=${API_EVENTO_LIST_URL:http://localhost:8084/api/eventos}

broker.queue.inscricao.criada=inscricao.criada.comunicacoes