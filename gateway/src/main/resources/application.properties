spring.application.name=gateway

server.port=${SERVER_PORT:8080}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Routes
spring.cloud.gateway.mvc.routes[0].id=auth-api
spring.cloud.gateway.mvc.routes[0].uri=lb://auth-api
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=usuario-api
spring.cloud.gateway.mvc.routes[1].uri=lb://usuario-api
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.mvc.routes[2].id=local-api
spring.cloud.gateway.mvc.routes[2].uri=lb://local-api
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/locais/**

spring.cloud.gateway.mvc.routes[3].id=evento-api
spring.cloud.gateway.mvc.routes[3].uri=lb://evento-api
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/eventos/**

spring.cloud.gateway.mvc.routes[4].id=inscricao-api
spring.cloud.gateway.mvc.routes[4].uri=lb://inscricao-api
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/inscricoes/**