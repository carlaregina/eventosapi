spring.application.name=local-api
server.port=${SERVER_PORT:8081}
# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:eventos}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate

# Swagger
springdoc.api-docs.path=/documentacao
springdoc.swagger-ui.path=/documentacao.html

# APIs
api.usuario.list-url=${API_USUARIO_LIST_URL:http://localhost:8082/api/usuarios}

# Security
security.token.secret=${JWT_SECRET:eventos}
security.token.expiration-time-in-minutes=${JWT_EXPIRATION_IN_MINUTES:60}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Health
management.endpoints.web.exposure.include=health,info,prometheus

# Logging
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}